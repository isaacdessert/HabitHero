<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitHero — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>

  <div class="page-dashboard">

    <header class="dashboard-header">
      <div class="dashboard-header__title">
        <span class="dashboard-header__icon">⚔</span>
        HABIT HERO
      </div>
    </header>

    <p class="dashboard-subtitle">// MANAGE YOUR DAILY QUESTS</p>

    <div id="skill-grid" class="skill-grid"></div>

    <footer class="dashboard-footer">
      <a
        href="mailto:your@email.com?subject=HabitHero%20Feature%20Request&body=Hi%20Isaac%2C%0A%0AI%27d%20love%20to%20suggest%20a%20feature%3A%0A%0A"
        class="suggest-link"
      >💡 Suggest a Feature</a>
    </footer>

  </div>

  <!-- Modal overlay (shared) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
